# Configuração de log do Spark (JVM / Log4j 2).
#
# O log_level definido em config_bigdata.json só é aplicado DEPOIS que a
# SparkSession é criada; as mensagens INFO de inicialização (SparkContext,
# BlockManager, Executor, etc.) vêm do Log4j da JVM e precisam ser
# silenciadas por este arquivo, carregado na inicialização via:
#
#   spark-submit --driver-java-options "-Dlog4j.configurationFile=file:log4j2.properties" ...

rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Silencia ruídos conhecidos de bibliotecas internas
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = warn
logger.parquet.name = org.apache.parquet
logger.parquet.level = warn
